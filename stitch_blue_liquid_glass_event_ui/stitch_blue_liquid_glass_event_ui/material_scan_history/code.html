<style>
        /* Custom Utilities for Liquid Glass & Glow */
        .bg-obsidian-gradient {
            background: linear-gradient(145deg, rgba(25,18,10,0.95) 0%, rgba(5,5,5,1) 100%);
        }
        
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .glass-panel-active {
            background: linear-gradient(135deg, rgba(242, 169, 0, 0.15) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-top: 1px solid rgba(242, 169, 0, 0.4);
            border-left: 1px solid rgba(242, 169, 0, 0.2);
        }

        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60vh;
            background: radial-gradient(circle at 50% -20%, rgba(242, 169, 0, 0.25) 0%, rgba(25, 18, 10, 0) 70%);
            pointer-events: none;
            z-index: -1;
        }

        .ambient-glow-green {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 100% 0%, rgba(0, 255, 148, 0.1) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-red {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 100% 0%, rgba(255, 59, 48, 0.1) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .compact-card {
            padding: 12px 16px;
        }
        
        /* Layout resets for fixed navs */
        body { padding-top: 4rem; padding-bottom: 6rem; }

<body class="bg-[#050505] text-on-surface font-body-md min-h-screen relative overflow-x-hidden">
<!-- Liquid Glass Ambient Glow -->
<div class="ambient-glow"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-16 bg-transparent md:px-container-padding-desktop">
<button class="active:scale-95 transition-transform p-2 -ml-2 rounded-full hover:bg-white/5 text-amber-accent/80">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-lg-mobile text-[20px] tracking-widest text-amber-accent font-bold">
            LUMINA
        </div>
<button class="active:scale-95 transition-transform p-2 -mr-2 rounded-full hover:bg-white/5 text-amber-accent/80">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="max-w-[1280px] mx-auto px-container-padding-mobile md:px-container-padding-desktop py-stack-md md:py-stack-lg flex flex-col gap-stack-md">
<!-- Header Section -->
<section class="flex flex-col gap-1 mt-4">
<h1 class="font-display-lg text-[36px] text-white font-bold leading-tight drop-shadow-md">Scan History</h1>
<p class="font-body-md text-[14px] text-white/60">Review recent ticket processing logs.</p>
</section>
<!-- Filter Buttons (Side-by-side) -->
<section class="grid grid-cols-2 gap-4 mt-2 mb-2">
<!-- Scanned (Active) -->
<button class="glass-panel rounded-2xl py-3 px-4 flex items-center justify-center gap-2 active:scale-95 transition-transform relative overflow-hidden group">
<span class="material-symbols-outlined text-amber-accent" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
<span class="font-label-md text-[13px] text-amber-accent uppercase tracking-widest font-semibold">Scanned</span>
</button>
<!-- Rejected (Inactive) -->
<button class="glass-panel rounded-2xl py-3 px-4 flex items-center justify-center gap-2 active:scale-95 transition-all text-white/50 group hover:bg-white/5 glass-panel-active">
<span class="material-symbols-outlined group-hover:text-white transition-colors">cancel</span>
<span class="font-label-md text-[13px] uppercase tracking-widest group-hover:text-white transition-colors">Rejected</span>
</button>
</section>
<!-- Ticket Cards List - Compact -->
<section class="flex flex-col gap-3 z-10 pb-stack-xl relative">
<!-- Stack effect background -->
<div class="absolute -top-2 left-4 right-4 h-10 glass-panel rounded-t-3xl opacity-50 z-[-1]"></div>
<div class="absolute -top-4 left-8 right-8 h-10 glass-panel rounded-t-3xl opacity-20 z-[-2]"></div>
<!-- Scanned Ticket Card 1 -->
<article class="glass-panel bg-obsidian-gradient rounded-3xl compact-card relative overflow-hidden flex items-center gap-4 hidden">
<div class="ambient-glow-green"></div>
<div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-electric-green/10 text-electric-green z-10">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">check</span>
</div>
<div class="flex-grow flex flex-col z-10">
<div class="flex justify-between items-center mb-1">
<h2 class="font-headline-lg-mobile text-[16px] text-white font-semibold leading-none">VIP Entry: NEON GA</h2>
<span class="font-mono-sm text-[11px] text-electric-green/80">#TX-8924A</span>
</div>
<div class="flex items-center gap-3 text-white/50 font-mono-sm text-[11px]">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span> 22:45, Oct 24</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">person</span> Alex Vance</span>
</div>
</div>
</article>
<!-- Rejected Ticket Card 1 -->
<article class="glass-panel bg-obsidian-gradient rounded-3xl compact-card relative overflow-hidden flex items-center gap-4 py-2">
<div class="ambient-glow-red"></div>
<div class="flex-shrink-0 flex items-center justify-center rounded-full bg-vibrant-red/10 text-vibrant-red z-10 h-8 w-8">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">close</span>
</div>
<div class="flex-grow flex flex-col z-10">
<div class="flex justify-between items-center mb-1">
<h2 class="font-headline-lg-mobile text-[16px] text-white font-semibold leading-none">GA Entry: SECTOR 4</h2>
<span class="font-mono-sm text-[11px] text-vibrant-red/80">#TX-1109X</span>
</div>
<div class="flex items-center gap-3 text-white/50 font-mono-sm text-[11px]">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span> 22:15, Oct 24</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">error</span> Expired</span>
</div>
</div>
</article>
<!-- Scanned Ticket Card 2 -->
<article class="glass-panel bg-obsidian-gradient rounded-3xl compact-card relative overflow-hidden flex items-center gap-4 opacity-90 hidden">
<div class="ambient-glow-green opacity-50"></div>
<div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-electric-green/10 text-electric-green z-10">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">check</span>
</div>
<div class="flex-grow flex flex-col z-10">
<div class="flex justify-between items-center mb-1">
<h2 class="font-headline-lg-mobile text-[16px] text-white font-semibold leading-none">BACKSTAGE PASS</h2>
<span class="font-mono-sm text-[11px] text-electric-green/80">#TX-5542B</span>
</div>
<div class="flex items-center gap-3 text-white/50 font-mono-sm text-[11px]">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span> 21:30, Oct 24</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">person</span> C. Redfield</span>
</div>
</div>
</article>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 flex justify-center pb-safe mb-6">
<div class="glass-panel rounded-full mx-auto w-[90%] max-w-md flex justify-around items-center py-2 px-2">
<!-- Discover (Inactive) -->
<button class="flex flex-col items-center justify-center text-white/50 px-6 py-2 hover:text-white transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-label-md text-[11px] mt-1">Discover</span>
</button>
<!-- History (Active) -->
<button class="flex flex-col items-center justify-center text-amber-accent shadow-[inset_0_0_12px_rgba(242,169,0,0.2)] bg-amber-accent/10 rounded-full px-6 py-2 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="confirmation_number" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">confirmation_number</span>
<span class="font-label-md text-[11px] mt-1 font-semibold">History</span>
</button>
<!-- Profile (Inactive) -->
<button class="flex flex-col items-center justify-center text-white/50 px-6 py-2 hover:text-white transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-[11px] mt-1">Profile</span>
</button>
