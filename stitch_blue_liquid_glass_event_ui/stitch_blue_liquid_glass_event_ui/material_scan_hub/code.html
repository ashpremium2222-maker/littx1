<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lumina - Discovery</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#323537",
                        "secondary": "#c3c6d7",
                        "surface": "#101415",
                        "secondary-fixed-dim": "#c3c6d7",
                        "on-secondary-fixed-variant": "#434654",
                        "secondary-container": "#454957",
                        "inverse-primary": "#005bc1",
                        "on-error": "#690005",
                        "inverse-surface": "#e0e3e5",
                        "on-primary": "#002e69",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#00285c",
                        "on-background": "#e0e3e5",
                        "on-secondary-container": "#b5b8c9",
                        "surface-variant": "#323537",
                        "background": "#0b0f10", /* Darker base */
                        "surface-container": "#1d2022",
                        "outline": "#8b90a0",
                        "tertiary-fixed": "#d8e3fb",
                        "surface-container-high": "#272a2c",
                        "error-container": "#93000a",
                        "on-surface-variant": "#c1c6d7",
                        "on-primary-fixed": "#001a41",
                        "on-surface": "#e0e3e5",
                        "surface-container-low": "#191c1e",
                        "on-tertiary-container": "#1f2a3c",
                        "on-tertiary": "#263143",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#171b28",
                        "outline-variant": "#414755",
                        "surface-bright": "#363a3b",
                        "on-tertiary-fixed": "#111c2d",
                        "on-primary-fixed-variant": "#004493",
                        "surface-dim": "#101415",
                        "tertiary-container": "#8691a7",
                        "tertiary-fixed-dim": "#bcc7de",
                        "primary": "#007aff", /* Custom preset color */
                        "tertiary": "#bcc7de",
                        "secondary-fixed": "#dfe2f3",
                        "primary-container": "#004493",
                        "error": "#ffb4ab",
                        "surface-tint": "#007aff",
                        "inverse-on-surface": "#2d3133",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary": "#2c303d",
                        "on-tertiary-fixed-variant": "#3c475a",
                        "surface-container-lowest": "#0b0f10"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "4xl": "2rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "container-padding-mobile": "20px",
                        "gutter": "16px",
                        "container-padding-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "mono-sm": ["Geist"],
                        "label-md": ["Geist"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "mono-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.1);
        }
        
        .liquid-glass-recessed {
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255,255,255,0.05), 0 1px 0 rgba(255,255,255,0.1);
        }

        .card-stack-1 {
            transform: translateY(0) scale(1);
            z-index: 3;
            background: linear-gradient(180deg, #1a2228 0%, #101415 100%);
        }
        .card-stack-2 {
            transform: translateY(-16px) scale(0.95);
            z-index: 2;
            opacity: 0.8;
            background: linear-gradient(180deg, #242f36 0%, #1a2228 100%);
            filter: brightness(0.8);
        }
        .card-stack-3 {
            transform: translateY(-32px) scale(0.9);
            z-index: 1;
            opacity: 0.5;
            background: linear-gradient(180deg, #2e3c45 0%, #242f36 100%);
            filter: brightness(0.6);
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
        }

        .ambient-glow {
            background: radial-gradient(circle at 50% 50%, rgba(0, 122, 255, 0.15) 0%, transparent 60%);
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container font-headline-lg relative">
<!-- Ambient Background Lighting -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-20%] w-[100vw] h-[100vw] rounded-full bg-primary opacity-20 blur-[120px] mix-blend-screen"></div>
<div class="absolute bottom-[10%] right-[-30%] w-[80vw] h-[80vw] rounded-full bg-cyan-600 opacity-15 blur-[100px] mix-blend-screen"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-40 bg-transparent">
<div class="flex justify-between items-center w-full px-container-padding-mobile h-20 md:px-container-padding-desktop max-w-7xl mx-auto pt-4">
<button class="w-12 h-12 flex items-center justify-center rounded-full liquid-glass hover:bg-white/10 transition-colors group">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">menu</span>
</button>
<h1 class="font-display-lg text-2xl md:text-3xl font-bold tracking-tight text-white drop-shadow-md">LUMINA</h1>
<button class="w-12 h-12 flex items-center justify-center rounded-full liquid-glass hover:bg-white/10 transition-colors group">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">search</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="relative z-10 pt-28 pb-48 min-h-screen flex flex-col items-center max-w-md mx-auto w-full px-4 space-y-8">
<!-- Hero / Recessed Area -->
<div class="w-full flex flex-col items-center justify-center py-8">
<h2 class="font-display-lg text-4xl text-white mb-2 text-center font-bold tracking-tight glow-text">Start Scan</h2>
<p class="font-body-md text-on-surface-variant text-center max-w-[280px] mb-10">Position code within frame</p>
<div class="relative w-64 h-64 liquid-glass-recessed rounded-full flex items-center justify-center">
<div class="absolute inset-0 rounded-full border border-primary/20 animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-4 rounded-full border border-primary/10 animate-[spin_15s_linear_infinite_reverse]"></div>
<!-- Center Scan Target -->
<div class="relative w-32 h-32 flex items-center justify-center liquid-glass rounded-4xl">
<div class="absolute inset-0 ambient-glow rounded-4xl"></div>
<span class="material-symbols-outlined text-5xl text-primary drop-shadow-[0_0_15px_rgba(0,122,255,0.8)]" style="font-variation-settings: 'wght' 300;">view_in_ar</span>
</div>
</div>
</div>
<!-- Stacked History / Secondary Glimpse -->
<div class="w-full relative h-40 mt-4">
<!-- Card 3 (Bottom) -->
<div class="absolute top-0 left-0 w-full h-24 rounded-3xl card-stack-3 border border-white/5 px-6 py-4 flex items-center shadow-2xl"></div>
<!-- Card 2 (Middle) -->
<div class="absolute top-0 left-0 w-full h-24 rounded-3xl card-stack-2 border border-white/10 px-6 py-4 flex items-center shadow-2xl"></div>
<!-- Card 1 (Top) -->
<div class="absolute top-0 left-0 w-full h-28 rounded-3xl card-stack-1 border border-white/20 px-6 py-4 flex items-center justify-between shadow-2xl liquid-glass">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">history</span>
</div>
<div>
<p class="font-bold text-white text-lg">Recent Scans</p>
<p class="text-sm text-on-surface-variant">View history</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
</main>
<!-- Bottom Anchored Action Container -->
<div class="fixed bottom-0 left-0 w-full z-50 px-4 pb-8 pt-12 bg-gradient-to-t from-background via-background/90 to-transparent pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<!-- Primary Actions Group -->
<div class="liquid-glass rounded-[2rem] p-2 flex gap-2 mb-6 shadow-2xl border-white/10">
<button class="flex-1 bg-primary hover:bg-primary/90 text-white rounded-3xl py-4 flex flex-col items-center justify-center gap-2 transition-all shadow-[0_0_20px_rgba(0,122,255,0.4)]">
<span class="material-symbols-outlined">qr_code_scanner</span>
<span class="font-label-md text-sm font-semibold tracking-wide">Scan QR</span>
</button>
<button class="flex-1 bg-surface-container-high/50 hover:bg-surface-container-high text-white rounded-3xl py-4 flex flex-col items-center justify-center gap-2 transition-all border border-white/5">
<span class="material-symbols-outlined">keyboard</span>
<span class="font-label-md text-sm font-semibold tracking-wide">Manual</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="w-full rounded-full liquid-glass flex justify-around items-center px-2 py-2 border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.5)]">
<button class="flex items-center justify-center bg-white text-black rounded-full w-12 h-12 shadow-[0_0_20px_rgba(255,255,255,0.3)] transition-all">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">explore</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:text-white transition-all">
<span class="material-symbols-outlined text-xl">confirmation_number</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:text-white transition-all">
<span class="material-symbols-outlined text-xl">person</span>
</button>
</nav>
</div>
</div>
</body></html>
