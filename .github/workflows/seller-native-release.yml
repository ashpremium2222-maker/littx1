name: Publish Seller Native APK

on:
  push:
    tags: ["seller-v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version, for example 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seller-native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore protected signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SELLER_SIGNING_STORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/seller-upload.jks"
      - name: Build signed APK
        env:
          SELLER_API_BASE_URL: ${{ vars.SELLER_API_BASE_URL }}
          SELLER_UPDATE_REPOSITORY: ${{ github.repository }}
          SELLER_VERSION_CODE: ${{ github.run_number }}
          SELLER_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          SELLER_SIGNING_STORE_FILE: ${{ runner.temp }}/seller-upload.jks
          SELLER_SIGNING_STORE_PASSWORD: ${{ secrets.SELLER_SIGNING_STORE_PASSWORD }}
          SELLER_SIGNING_KEY_ALIAS: ${{ secrets.SELLER_SIGNING_KEY_ALIAS }}
          SELLER_SIGNING_KEY_PASSWORD: ${{ secrets.SELLER_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: seller-native-android/app/build/outputs/apk/release/app-release.apk
