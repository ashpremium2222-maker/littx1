name: Publish Scanner Native APK

on:
  push:
    tags: ["scanner-v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version, for example 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner-native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore protected signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCANNER_SIGNING_STORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scanner-upload.jks"
      - name: Build signed scanner APK
        env:
          SCANNER_API_BASE_URL: ${{ vars.SCANNER_API_BASE_URL }}
          SCANNER_UPDATE_REPOSITORY: ${{ github.repository }}
          SCANNER_VERSION_CODE: ${{ github.run_number }}
          SCANNER_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          SCANNER_SIGNING_STORE_FILE: ${{ runner.temp }}/scanner-upload.jks
          SCANNER_SIGNING_STORE_PASSWORD: ${{ secrets.SCANNER_SIGNING_STORE_PASSWORD }}
          SCANNER_SIGNING_KEY_ALIAS: ${{ secrets.SCANNER_SIGNING_KEY_ALIAS }}
          SCANNER_SIGNING_KEY_PASSWORD: ${{ secrets.SCANNER_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: scanner-native-android/app/build/outputs/apk/release/app-release.apk
