name: Scanner Native Android

on:
  push:
    paths: ["scanner-native-android/**", ".github/workflows/scanner-native-android.yml"]
  pull_request:
    paths: ["scanner-native-android/**", ".github/workflows/scanner-native-android.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner-native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble scanner debug APK
        run: gradle :app:assembleDebug -PSCANNER_API_BASE_URL=https://ci.invalid/
