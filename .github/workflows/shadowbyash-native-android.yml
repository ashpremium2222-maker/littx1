name: Shadow by Ash Android
on:
  push:
    paths: ["shadowbyash-native-android/**", ".github/workflows/shadowbyash-native-android.yml"]
  pull_request:
    paths: ["shadowbyash-native-android/**", ".github/workflows/shadowbyash-native-android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :app:assembleDebug
        working-directory: shadowbyash-native-android
      - uses: actions/upload-artifact@v4
        with: { name: shadowbyash-debug-apk, path: shadowbyash-native-android/app/build/outputs/apk/debug/app-debug.apk }
