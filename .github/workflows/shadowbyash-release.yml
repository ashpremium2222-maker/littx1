name: Release Shadow by Ash Android

on:
  push:
    tags:
      - "shadow-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example shadow-v1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shadowbyash-android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure persistent release signing
        env:
          SHADOW_SIGNING_KEYSTORE_BASE64: ${{ secrets.SHADOW_SIGNING_KEYSTORE_BASE64 }}
          SHADOW_SIGNING_STORE_PASSWORD: ${{ secrets.SHADOW_SIGNING_STORE_PASSWORD }}
          SHADOW_SIGNING_KEY_ALIAS: ${{ secrets.SHADOW_SIGNING_KEY_ALIAS }}
          SHADOW_SIGNING_KEY_PASSWORD: ${{ secrets.SHADOW_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SHADOW_SIGNING_KEYSTORE_BASE64" ] || [ -z "$SHADOW_SIGNING_STORE_PASSWORD" ] || [ -z "$SHADOW_SIGNING_KEY_ALIAS" ] || [ -z "$SHADOW_SIGNING_KEY_PASSWORD" ]; then
            echo "Configure the four SHADOW_SIGNING_* GitHub Actions secrets using the existing Shadow by Ash release key before publishing a tagged release."
            exit 1
          fi
          printf '%s' "$SHADOW_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shadowbyash-release.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "SHADOW_SIGNING_STORE_FILE=$RUNNER_TEMP/shadowbyash-release.jks"
            echo "SHADOW_SIGNING_STORE_PASSWORD=$SHADOW_SIGNING_STORE_PASSWORD"
            echo "SHADOW_SIGNING_KEY_ALIAS=$SHADOW_SIGNING_KEY_ALIAS"
            echo "SHADOW_SIGNING_KEY_PASSWORD=$SHADOW_SIGNING_KEY_PASSWORD"
          } > local.properties

      - name: Build and verify signed APK
        env:
          APK_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
        run: |
          bash ./gradlew :app:assembleRelease
          mkdir -p app/build/outputs/apk/release/published
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/published/shadowbyash-${APK_VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/published/shadowbyash-${APK_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowbyash-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          path: shadowbyash-android/app/build/outputs/apk/release/published/shadowbyash-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          name: Shadow by Ash ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: shadowbyash-android/app/build/outputs/apk/release/published/shadowbyash-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}.apk
