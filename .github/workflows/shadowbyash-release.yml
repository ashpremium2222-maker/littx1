name: Release Shadow by Ash Android

on:
  push:
    tags:
      - "shadow-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example shadow-v1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shadowbyash-native-android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Sign and verify APK
        env:
          APK_VERSION: ${{ github.ref_name }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/shadowbyash-release.jks" \
            -storepass shadowbyash \
            -keypass shadowbyash \
            -alias shadowbyash \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Shadow by Ash, OU=Android, O=Shadow by Ash, L=India, C=IN"
          unsigned=$(find app/build/outputs/apk/release -name '*unsigned.apk' -print -quit)
          if [ -z "$unsigned" ]; then unsigned=$(find app/build/outputs/apk/release -name '*.apk' -print -quit); fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/shadowbyash-release.jks" \
            --ks-pass pass:shadowbyash \
            --key-pass pass:shadowbyash \
            --out "app/build/outputs/apk/release/shadowbyash-${APK_VERSION}.apk" \
            "$unsigned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/shadowbyash-${APK_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowbyash-${{ github.ref_name }}
          path: shadowbyash-native-android/app/build/outputs/apk/release/shadowbyash-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          name: Shadow by Ash ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: shadowbyash-native-android/app/build/outputs/apk/release/shadowbyash-${{ github.ref_name }}.apk
