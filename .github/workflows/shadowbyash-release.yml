name: Release Shadow by Ash Android

on:
  push:
    tags:
      - "shadow-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example shadow-v1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shadowbyash-native-android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowbyash-${{ github.ref_name }}
          path: shadowbyash-native-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          name: Shadow by Ash ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: shadowbyash-native-android/app/build/outputs/apk/release/*.apk
